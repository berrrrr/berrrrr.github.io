<header class="topbar">
  <div class="topbar__inner">
    {% assign home_url = '/' %}{% if page.lang == 'en' %}{% assign home_url = '/en/' %}{% endif %}
    <a class="brand" href="{{ home_url | relative_url }}" aria-label="{{ site.title }} {% if page.lang == 'en' %}home{% else %}홈{% endif %}"><span class="brand__mark">M</span><span><b>{{ site.title }}</b><small>DEV · DATA · LIFE</small></span></a>
    <nav class="topbar__nav" aria-label="{% if page.lang == 'en' %}Main navigation{% else %}주요 메뉴{% endif %}">
      {% if page.lang == 'en' %}<a href="{{ '/en/' | relative_url }}">Articles</a><a href="{{ '/en/feed.xml' | relative_url }}">RSS</a><a lang="ko" hreflang="ko" href="{{ page.translation_url | default:'/' | relative_url }}">한국어</a>
      {% else %}<a href="{{ '/posts/' | relative_url }}">Archive</a><a href="{{ '/about/' | relative_url }}">About</a><a href="{{ '/feed.xml' | relative_url }}">RSS</a><a lang="en" hreflang="en" href="{{ page.translation_url | default:'/en/' | relative_url }}">English</a>{% endif %}
    </nav>
    <button class="rail-toggle" type="button" data-rail-toggle aria-controls="category-rail" aria-expanded="false"><span></span><span></span><span></span><b class="sr-only">{% if page.lang == 'en' %}Open navigation{% else %}카테고리 열기{% endif %}</b></button>
  </div>
</header>
