<aside class="comments" role="complementary" aria-labelledby="comments-title">
  <header class="comments__head">
    <div><p class="eyebrow">DISCUSSION</p><h2 id="comments-title">Comments</h2></div>
  </header>
  <div class="giscus-shell">
    <script src="https://giscus.app/client.js"
      data-repo="{{ site.giscus.repo }}"
      data-repo-id="{{ site.giscus.repo_id }}"
      data-category="{{ site.giscus.category }}"
      data-category-id="{{ site.giscus.category_id }}"
      data-mapping="{{ site.giscus.mapping | default:'pathname' }}"
      data-strict="0"
      data-reactions-enabled="1"
      data-emit-metadata="0"
      data-input-position="bottom"
      data-theme="{{ site.giscus.theme | default:'light' }}"
      data-lang="ko"
      data-loading="lazy"
      crossorigin="anonymous"
      async></script>
  </div>
  <noscript>댓글을 보려면 JavaScript를 활성화해주세요.</noscript>
</aside>
