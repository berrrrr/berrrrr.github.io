<aside class="lofi-player glass" data-lofi-player aria-label="로파이 라디오 플레이어">
  <audio data-lofi-audio preload="none"></audio>
  <span class="lofi-player__signal" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  <button class="lofi-player__control" type="button" data-lofi-previous aria-label="이전 채널">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 6 9 12l10 6V6Z"/></svg>
  </button>
  <button class="lofi-player__toggle" type="button" data-lofi-toggle aria-label="라디오 재생">
    <span class="lofi-player__play" aria-hidden="true"></span>
  </button>
  <button class="lofi-player__control" type="button" data-lofi-next aria-label="다음 채널">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 6l10 6-10 6V6Z"/></svg>
  </button>
  <button class="lofi-player__control lofi-player__mute" type="button" data-lofi-mute aria-label="음소거">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10H4Z"/><path class="lofi-player__waves" d="M16 9.2c.9.7 1.4 1.7 1.4 2.8s-.5 2.1-1.4 2.8M18.5 6.8A6.7 6.7 0 0 1 21 12a6.7 6.7 0 0 1-2.5 5.2"/><path class="lofi-player__slash" d="m5 5 14 14"/></svg>
  </button>
  <input class="lofi-player__volume" data-lofi-volume type="range" min="0" max="1" step="0.05" value="0.35" aria-label="볼륨">
  <button class="lofi-player__collapse" type="button" data-lofi-collapse aria-label="플레이어 최소화" aria-expanded="true">
    <svg class="lofi-player__collapse-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5 5 5-5"/></svg>
    <span class="lofi-player__collapsed-signal" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  </button>
  <p class="sr-only" data-lofi-status aria-live="polite">정지됨</p>
</aside>
