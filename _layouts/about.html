---
layout: base
---
{% assign author = site.data.authors[page.author] | default:site.data.authors.first[1] %}
<article class="page glass reveal"><header><p class="eyebrow">ABOUT THIS ARCHIVE</p><h1 class="page-title">{{ page.title }}</h1></header><div class="about-profile">{% if author.picture %}<img src="{{ author.picture.src | default:author.picture | relative_url }}" alt="{{ author.name }}">{% endif %}<div><h2>{{ author.name }}</h2>{{ author.about | markdownify }}</div></div><div class="prose">{{ content }}</div></article>
